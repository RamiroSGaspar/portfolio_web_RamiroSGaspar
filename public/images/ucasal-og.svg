<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 367" role="img" aria-label="FI UCASAL: Expectativa vs Realidad">
<title>FI UCASAL: Expectativa vs Realidad</title>
<desc>Proyecto de analisis de datos sobre la Facultad de Ingenieria UCASAL como subconjunto de la universidad</desc>

<defs>
  <linearGradient id="brandGrad" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="#e11d48"/>
    <stop offset="1" stop-color="#14b8a6"/>
  </linearGradient>
  <linearGradient id="brandGradRev" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="#14b8a6"/>
    <stop offset="1" stop-color="#e11d48"/>
  </linearGradient>
  <!-- Gradient con userSpaceOnUse para que abarque el circulo chico horizontalmente -->
  <linearGradient id="circleGrad" x1="438" y1="0" x2="582" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#e11d48"/>
    <stop offset="1" stop-color="#14b8a6"/>
  </linearGradient>
</defs>

<!-- Fondo -->
<rect width="690" height="367" fill="#18181b"/>

<!-- Banda superior -->
<rect x="0" y="0" width="690" height="3" fill="url(#brandGrad)"/>

<!-- ============ LADO DERECHO: CIRCULOS CONCENTRICOS ============ -->

<!-- Circulo grande UCASAL (universo) -->
<circle cx="540" cy="183" r="128" fill="none" stroke="#a1a1aa" stroke-width="1.5" opacity="0.42"/>

<!-- Etiqueta UCASAL (dentro del grande, parte superior, fuera del chico) -->
<text x="578" y="93" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#a1a1aa" opacity="0.75" letter-spacing="1.5">UCASAL</text>

<!-- Circulo chico FI (subconjunto analizado) -->
<circle cx="510" cy="218" r="72" fill="none" stroke="url(#circleGrad)" stroke-width="2.5"/>

<!-- Etiqueta Facultad de Ingenieria (dentro del chico, centrada en dos lineas) -->
<text x="510" y="214" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff" opacity="0.92" letter-spacing="0.3">Facultad de</text>
<text x="510" y="230" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff" opacity="0.92" letter-spacing="0.3">Ingeniería</text>

<!-- ============ LADO IZQUIERDO: TITULO ============ -->

<!-- Label superior: FI UCASAL -->
<text x="42" y="120" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" letter-spacing="2"><tspan fill="#22d3ee">FI</tspan><tspan fill="#a1a1aa"> UCASAL</tspan></text>

<!-- Linea 1: Expectativa -->
<text x="42" y="175" font-family="Inter, system-ui, sans-serif" font-size="38" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Expectativa</text>

<!-- Linea 2: "vs " (blanco) + "Realidad" (gradient) - dos text separados para evitar bugs de tspan -->
<text x="42" y="222" font-family="Inter, system-ui, sans-serif" font-size="38" font-weight="700" fill="#ffffff" letter-spacing="-0.5">vs</text>
<text x="102.6" y="222" font-family="Inter, system-ui, sans-serif" font-size="38" font-weight="700" fill="url(#brandGrad)" letter-spacing="-0.5">Realidad</text>

<!-- Linea separadora con gradiente -->
<rect x="42" y="247" width="60" height="2.5" rx="1.25" fill="url(#brandGrad)"/>

<!-- Banda inferior -->
<rect x="0" y="364" width="690" height="3" fill="url(#brandGradRev)"/>

</svg>